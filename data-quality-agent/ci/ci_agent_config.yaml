# CI configuration — used by GitHub Actions.
# Points at the synthetic CSV generated by ci/generate_ci_data.py.
# All paths relative to data-quality-agent/.

data_dictionary:
  csv_path: "ci/outputs/contacts_ci.csv"
  dictionary_path: "../Documentation/SaaS_Support_Contact_Data_Dictionary.md"
  sample_rows: 2000
  case_insensitive_column_match: true
  inconsistency_threshold: 0.05
  reports_dir: "ci/outputs/reports"
  knowledge_base_path: "ci/knowledge/learnings.json"

html_report:
  enabled: true

llm_dedup:
  # Enabled automatically by CI when ANTHROPIC_API_KEY secret is set.
  enabled: false
  model: "claude-haiku-4-5-20251001"
  min_similarity: 0.70
  max_pairs_per_column: 5
  timeout: 15

missing_values:
  high_null_threshold: 0.50
  always_null_threshold: 1.00
  reports_dir: "ci/outputs/reports"
  knowledge_base_path: "ci/knowledge/learnings.json"

data_types:
  categorical_cardinality_max: 20
  uniqueness_id_threshold: 0.99
  sample_values_count: 5
  reports_dir: "ci/outputs/reports"

impossible_values:
  reports_dir: "ci/outputs/reports"
  knowledge_base_path: "ci/knowledge/learnings.json"
  min_violation_rate: 0.0
  rules:
    - label: nps_range
      column: NPS_SCORE
      min: 0
      max: 10
      description: "NPS must be 0–10"
    - label: csat_range
      column: CSAT_SCORE
      min: 1
      max: 5
      description: "CSAT must be 1–5"
    - label: wait_time_non_negative
      column: WAIT_TIME_SEC
      min: 0
      description: "Wait time must be >= 0"
    - label: handling_time_non_negative
      column: TOTAL_HANDLING_TIME_SEC
      min: 0
      description: "Handling time must be >= 0"

invalid_entries:
  reports_dir: "ci/outputs/reports"
  knowledge_base_path: "ci/knowledge/learnings.json"
  min_violation_rate: 0.0
  check_placeholders: true
  check_whitespace: true
  rules:
    - label: channel_enum
      type: enum
      column: CHANNEL
      allowed: [email, Email, EMAIL, chat, Chat, phone, portal]
      description: "Channel must be one of the allowed values"
    - label: contact_month_format
      type: pattern
      column: CONTACT_MONTH
      pattern: '^\d{4}-\d{2}$'
      description: "Contact month must be YYYY-MM"

outliers:
  reports_dir: "ci/outputs/reports"
  knowledge_base_path: "ci/knowledge/learnings.json"
  iqr_multiplier: 1.5
  zscore_threshold: 3.0
  min_non_null_rows: 30
  temporal_min_year: 2020
  temporal_max_year: 2035
  columns_exclude:
    - CONTACT_ID
    - AGENT_ID
    - PREVIOUS_AGENT_ID
    - SESSION_ID

categorical_cleaning:
  reports_dir: "ci/outputs/reports"
  knowledge_base_path: "ci/knowledge/learnings.json"
  max_cardinality: 50
  similarity_threshold: 0.85
  low_frequency_threshold: 0.01
  columns_include: []
  columns_exclude:
    - CUSTOMER_COMMENT
    - AI_CONVERSATION_SUMMARY
    - CUSTOMER_INITIAL_QUERY
    - PAGE_SOURCE
    - SESSION_ID
    - CONTACT_ID
