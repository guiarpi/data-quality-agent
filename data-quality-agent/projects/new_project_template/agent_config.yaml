# New project template
# Steps to use:
#   1. Copy this entire folder and rename it (e.g. "projects/my_dataset/")
#   2. Update csv_path and dictionary_path to point to your files
#   3. Update reports_dir and knowledge_base_path to match your folder name
#   4. Run: python -m agent.runner --config projects/my_dataset/agent_config.yaml
#
# All paths are relative to the data-quality-agent/ directory.
data_dictionary:
  csv_path: "../path/to/your_data.csv"
  dictionary_path: "../path/to/your_dictionary.md"
  sample_rows: 50000
  case_insensitive_column_match: true
  # Fraction of non-null values that must violate the expected type before flagging
  inconsistency_threshold: 0.05
  reports_dir: "projects/new_project_template/outputs/reports"
  knowledge_base_path: "projects/new_project_template/knowledge/learnings.json"

missing_values:
  high_null_threshold: 0.50
  always_null_threshold: 1.00
  reports_dir: "projects/new_project_template/outputs/reports"
  knowledge_base_path: "projects/new_project_template/knowledge/learnings.json"

data_types:
  categorical_cardinality_max: 20
  uniqueness_id_threshold: 0.99
  sample_values_count: 5
  reports_dir: "projects/new_project_template/outputs/reports"

categorical_cleaning:
  reports_dir: "projects/new_project_template/outputs/reports"
  knowledge_base_path: "projects/new_project_template/knowledge/learnings.json"
  max_cardinality: 50
  similarity_threshold: 0.85
  low_frequency_threshold: 0.01
  columns_include: []
  # Add free-text or ID columns to exclude from categorical analysis
  columns_exclude: []

outliers:
  reports_dir: "projects/new_project_template/outputs/reports"
  knowledge_base_path: "projects/new_project_template/knowledge/learnings.json"
  iqr_multiplier: 1.5
  zscore_threshold: 3.0
  min_non_null_rows: 30
  temporal_min_year: 2020
  temporal_max_year: 2035
  # Add column names to skip (e.g. ID columns, foreign keys)
  columns_exclude: []

impossible_values:
  reports_dir: "projects/new_project_template/outputs/reports"
  knowledge_base_path: "projects/new_project_template/knowledge/learnings.json"
  min_violation_rate: 0.0
  # Add your domain rules here. Supported types: range, date_order, not_null_if
  # Each rule must have a unique 'label' used for knowledge-base suppression.
  # Examples:
  #
  # - label: score_range
  #   column: NPS_SCORE
  #   min: 0
  #   max: 10
  #   description: "NPS must be 0–10"
  #
  # - label: exit_after_enter
  #   type: date_order
  #   earlier: QUEUE_ENTER_AT
  #   later: QUEUE_EXIT_AT
  #   description: "Queue entry must be before exit"
  #
  # - label: resolved_if_not_abandoned
  #   type: not_null_if
  #   when_column: IS_ABANDONED
  #   when_value: false
  #   then_column: RESOLVED_AT
  #   description: "Non-abandoned contacts must have a resolution timestamp"
  rules: []

invalid_entries:
  reports_dir: "projects/new_project_template/outputs/reports"
  knowledge_base_path: "projects/new_project_template/knowledge/learnings.json"
  min_violation_rate: 0.0
  check_placeholders: true
  check_whitespace: true
  # Add your format / enum rules here. Examples:
  #
  # - label: channel_enum
  #   type: enum
  #   column: CHANNEL
  #   allowed: [email, chat, phone, portal]
  #   description: "Channel must be one of the allowed values"
  #
  # - label: contact_month_format
  #   type: pattern
  #   column: CONTACT_MONTH
  #   pattern: '^\d{4}-\d{2}$'
  #   description: "Contact month must be in YYYY-MM format"
  rules: []
