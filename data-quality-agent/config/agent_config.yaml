# Data Quality Agent — default configuration
#
# Paths are relative to the data-quality-agent/ directory unless absolute.
#
# Quick start:
#   1. Set csv_path to your CSV file (relative or absolute)
#   2. Set dictionary_path to your markdown data dictionary
#   3. Run: python -m agent.runner
#
# For project-specific configs, copy projects/new_project_template/ and update
# paths there, then run: python -m agent.runner --config projects/<name>/agent_config.yaml

data_dictionary:
  # Path to the CSV file to validate
  csv_path: "../path/to/your_data.csv"
  # Path to the markdown data dictionary (pipe table with Variable, Definition, Data Type columns)
  # A sample fictional dictionary is included — point here to try the agent immediately:
  dictionary_path: "../Documentation/SaaS_Support_Contact_Data_Dictionary.md"
  # Number of rows to read from the CSV (keeps large files tractable)
  sample_rows: 50000
  # Match dictionary variable names to CSV headers ignoring case
  case_insensitive_column_match: true
  # Fraction of non-null values that must violate the declared type before flagging a column
  inconsistency_threshold: 0.05
  # Output directory for timestamped Markdown reports
  reports_dir: "outputs/reports"
  # Knowledge base: stores human-reviewed learnings for false-positive suppression
  knowledge_base_path: "knowledge/learnings.json"

missing_values:
  # Flag columns at or above this null rate as high-null
  high_null_threshold: 0.50
  # Flag columns at or above this null rate as always-null (1.00 = 100%)
  always_null_threshold: 1.00
  reports_dir: "outputs/reports"
  knowledge_base_path: "knowledge/learnings.json"

data_types:
  # Max distinct values before a column is no longer called "categorical"
  categorical_cardinality_max: 20
  # Unique rate at or above which a column is flagged as a likely identifier/key
  uniqueness_id_threshold: 0.99
  # Number of representative non-null values shown per column in the report
  sample_values_count: 5
  reports_dir: "outputs/reports"

impossible_values:
  reports_dir: "outputs/reports"
  knowledge_base_path: "knowledge/learnings.json"
  # Minimum violation rate before a rule finding is reported (0.0 = flag even one violation)
  min_violation_rate: 0.0
  # Rules — each must have a unique 'label' used for knowledge-base suppression.
  # Supported types: range, date_order, not_null_if
  # (type is inferred from config keys if not set explicitly)
  rules:
    # --- Numeric range checks ---
    - label: nps_score_range
      column: NPS_SCORE
      min: 0
      max: 10
      description: "NPS score must be between 0 and 10 (inclusive)"

    - label: csat_score_range
      column: CSAT_SCORE
      min: 1
      max: 5
      description: "CSAT score must be between 1 and 5 (inclusive)"

    - label: handling_time_positive
      column: TOTAL_HANDLING_TIME_SEC
      min: 0
      description: "Handling time in seconds must be non-negative"

    - label: queue_wait_positive
      column: QUEUE_WAIT_TIME_SEC
      min: 0
      description: "Queue wait time in seconds must be non-negative"

    - label: agent_tenure_positive
      column: AGENT_TENURE_MONTHS
      min: 0
      description: "Agent tenure in months must be non-negative"

    - label: sla_target_positive
      column: SLA_TARGET_SEC
      min: 0
      description: "SLA target in seconds must be non-negative"

    - label: bot_message_count_positive
      column: BOT_MESSAGE_COUNT
      min: 0
      description: "Bot message count must be non-negative"

    - label: customer_message_count_positive
      column: CUSTOMER_MESSAGE_COUNT
      min: 0
      description: "Customer message count must be non-negative"

    # --- Date ordering checks ---
    - label: created_before_queue_enter
      type: date_order
      earlier: CONTACT_CREATED_AT
      later: QUEUE_ENTER_AT
      description: "Contact must be created before it enters the queue"

    - label: queue_enter_before_exit
      type: date_order
      earlier: QUEUE_ENTER_AT
      later: QUEUE_EXIT_AT
      description: "Queue entry must be before queue exit"

    - label: queue_exit_before_resolved
      type: date_order
      earlier: QUEUE_EXIT_AT
      later: RESOLVED_AT
      description: "Queue exit must be before resolution timestamp"

    # --- Logical dependency checks ---
    - label: resolved_at_if_not_abandoned
      type: not_null_if
      when_column: IS_ABANDONED
      when_value: false
      then_column: RESOLVED_AT
      description: "Contacts not marked as abandoned should have a resolution timestamp"

    - label: ai_assisted_if_deflected
      type: not_null_if
      when_column: AI_DEFLECTED
      when_value: true
      then_column: AI_ASSISTED
      description: "AI-deflected contacts must also be marked as AI-assisted"

categorical_cleaning:
  reports_dir: "outputs/reports"
  knowledge_base_path: "knowledge/learnings.json"
  # Only analyse columns with fewer than this many distinct values
  max_cardinality: 50
  # difflib similarity cutoff for near-duplicate detection (0–1)
  similarity_threshold: 0.85
  # Flag categories representing less than this fraction of rows
  low_frequency_threshold: 0.01
  # If set, only analyse these columns (leave empty to analyse all categorical columns)
  columns_include: []
  # Columns to skip entirely (e.g. free-text fields, IDs)
  columns_exclude:
    - CUSTOMER_COMMENT
    - AI_CONVERSATION_SUMMARY
    - CUSTOMER_INITIAL_QUERY
    - PAGE_SOURCE
    - SESSION_ID

outliers:
  reports_dir: "outputs/reports"
  knowledge_base_path: "knowledge/learnings.json"
  # IQR fences: Q1 − multiplier×IQR and Q3 + multiplier×IQR
  iqr_multiplier: 1.5
  # Z-score: flag values more than this many standard deviations from the mean
  zscore_threshold: 3.0
  # Skip columns with fewer than this many non-null values (too few for reliable stats)
  min_non_null_rows: 30
  # Flag timestamps outside this year range
  temporal_min_year: 2020
  temporal_max_year: 2035
  # Columns to skip entirely — typically IDs and foreign keys
  columns_exclude:
    - CONTACT_ID
    - AGENT_ID
    - PREVIOUS_AGENT_ID

invalid_entries:
  reports_dir: "outputs/reports"
  knowledge_base_path: "knowledge/learnings.json"
  # Minimum violation rate before a finding is reported (0.0 = flag even one violation)
  min_violation_rate: 0.0
  # Automatically scan all string columns for placeholder / functional-null strings
  check_placeholders: true
  # Automatically scan all string columns for leading/trailing or double spaces
  check_whitespace: true
  # Configured rules — each must have a unique 'label'.
  # Supported types: enum (allowed values list), pattern (regex)
  rules:
    - label: channel_enum
      type: enum
      column: CHANNEL
      allowed: [email, chat, phone, portal]
      case_insensitive: true
      description: "Channel must be one of: email, chat, phone, portal"

    - label: plan_tier_enum
      type: enum
      column: PLAN_TIER
      allowed: [starter, growth, enterprise]
      case_insensitive: true
      description: "Plan tier must be one of: starter, growth, enterprise"

    - label: agent_team_enum
      type: enum
      column: AGENT_TEAM
      allowed: [tier-1, tier-2, solutions-engineering]
      case_insensitive: true
      description: "Agent team must be one of: tier-1, tier-2, solutions-engineering"

    - label: journey_stage_enum
      type: enum
      column: CUSTOMER_JOURNEY_STAGE
      allowed: [onboarding, active, renewal, churned]
      case_insensitive: true
      description: "Customer journey stage must be one of: onboarding, active, renewal, churned"

    - label: contact_month_format
      type: pattern
      column: CONTACT_MONTH
      pattern: '^\d{4}-\d{2}$'
      description: "Contact month must be in YYYY-MM format"
